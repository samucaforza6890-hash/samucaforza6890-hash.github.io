<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0624">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Block Burst – Neon Puzzle Arcade</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#070518;color:#fff;font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
body{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% -10%,#3a1f8f 0%,#1a0f4d 38%,#0a0626 70%,#04030f 100%)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(50% 35% at 12% 88%,rgba(255,47,179,.16),transparent 70%),radial-gradient(45% 30% at 92% 70%,rgba(25,230,255,.14),transparent 70%)}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}

/* ---------- shared block look ---------- */
.blk,.tile{--c:#19e6ff;--l:#b9f7ff;--d:#0a8fb0}
.blk.on,.tile{background:linear-gradient(145deg,var(--l) 0%,var(--c) 42%,var(--d) 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -3px 2px rgba(0,0,0,.35),inset 2px 0 2px rgba(255,255,255,.18),inset -2px 0 2px rgba(0,0,0,.18),0 0 9px -1px var(--c)}
.blk.on::before,.tile::before{content:'';position:absolute;left:11%;right:11%;top:8%;height:36%;border-radius:40% 40% 60% 60%/70% 70% 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.04));pointer-events:none}
.blk.on::after,.tile::after{content:'';position:absolute;left:14%;top:14%;width:15%;height:15%;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(.6px);pointer-events:none}
.blk{position:absolute;inset:0;border-radius:22%;opacity:0}
.blk.on{opacity:1}
.blk.on.ice{--c:#8fe3ff;--l:#f2fdff;--d:#3b9fd6;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 0 12px rgba(255,255,255,.65),0 0 10px rgba(120,220,255,.65)}
.blk.on.ice::after{left:20%;top:58%;width:60%;height:2px;border-radius:2px;background:rgba(255,255,255,.85);transform:rotate(-35deg);filter:none}
.blk.on.stone{--c:#7d839c;--l:#c3c8da;--d:#3a3e52;box-shadow:inset 0 2px 1px rgba(255,255,255,.35),inset 0 -3px 3px rgba(0,0,0,.5),0 0 4px rgba(0,0,0,.6)}
.blk.on.stone::before{opacity:.45}
.blk.on.stone::after{left:0;top:0;width:100%;height:100%;border-radius:inherit;background:radial-gradient(circle at 70% 70%,rgba(0,0,0,.25) 0 10%,transparent 12%),radial-gradient(circle at 30% 65%,rgba(0,0,0,.2) 0 8%,transparent 10%);filter:none}
.blk.on.stone.cracked::after{background:linear-gradient(118deg,transparent 44%,rgba(0,0,0,.75) 45%,rgba(0,0,0,.75) 49%,transparent 50%),linear-gradient(62deg,transparent 58%,rgba(0,0,0,.65) 59%,rgba(0,0,0,.65) 62%,transparent 63%),linear-gradient(170deg,transparent 30%,rgba(0,0,0,.55) 31%,rgba(0,0,0,.55) 33%,transparent 34%)}

/* ---------- menu ---------- */
#bgBlocks{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bgb{position:absolute;opacity:.2;border-radius:22%;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(110vh) rotate(0deg)}100%{transform:translateY(-20vh) rotate(360deg)}}
.menu-inner{position:relative;z-index:2;flex:1;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#logo{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:6px}
.logo-row{display:flex;gap:7px}
.tile{position:relative;width:clamp(46px,14vw,66px);aspect-ratio:1;border-radius:22%;display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite}
.tile span{position:relative;z-index:2;font-weight:900;font-size:clamp(26px,8vw,38px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 8px rgba(255,255,255,.5)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tagline{margin:0;letter-spacing:.42em;font-size:12px;font-weight:800;color:#b9a8ff;text-shadow:0 0 12px rgba(150,110,255,.8)}
.menu-btns{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.btn{position:relative;border:0;border-radius:18px;padding:15px 22px;font-weight:900;font-size:17px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(180deg,#6b5bff,#4a34d6);box-shadow:0 5px 0 #271a86,0 10px 24px rgba(90,60,255,.45),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #271a86,0 4px 10px rgba(90,60,255,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.btn small{font-size:11px;font-weight:700;letter-spacing:.12em;opacity:.85;text-shadow:none}
.btn.primary{background:linear-gradient(180deg,#ff58c6,#d3178f);box-shadow:0 5px 0 #7b0a57,0 10px 24px rgba(255,47,179,.45),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.primary:active{box-shadow:0 1px 0 #7b0a57,0 4px 10px rgba(255,47,179,.4),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.cyan{background:linear-gradient(180deg,#2fe8ff,#0a9fcb);box-shadow:0 5px 0 #05607c,0 10px 24px rgba(25,230,255,.4),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.cyan:active{box-shadow:0 1px 0 #05607c,0 4px 10px rgba(25,230,255,.35),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.gold{background:linear-gradient(180deg,#ffe35c,#f0a400);box-shadow:0 5px 0 #8b5a00,0 10px 24px rgba(255,200,30,.4),inset 0 2px 0 rgba(255,255,255,.5);color:#3a2300;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.gold:active{box-shadow:0 1px 0 #8b5a00,0 4px 10px rgba(255,200,30,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.18);font-size:14px;padding:12px 18px}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.18)}
.btn.danger{background:linear-gradient(180deg,#ff6a5c,#d1291b);box-shadow:0 5px 0 #7a1109,0 10px 24px rgba(255,80,60,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.sm{font-size:15px;padding:12px 18px}
.menu-sound{position:absolute;top:max(env(safe-area-inset-top),14px);right:14px;z-index:3}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35);padding:0}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.icon-btn.off{color:#8a82b8}

/* ---------- game screen ---------- */
#game{padding:max(env(safe-area-inset-top),8px) 12px max(env(safe-area-inset-bottom),10px);justify-content:center;gap:10px}
.hud-top,.scorebar,.goal,#tray{width:var(--bw,360px)}
.hud-top{height:48px;display:flex;align-items:center;justify-content:space-between}
.chip{padding:8px 18px;border-radius:999px;background:linear-gradient(90deg,rgba(25,230,255,.2),rgba(255,47,179,.2));border:1px solid rgba(255,255,255,.22);font-weight:900;letter-spacing:.18em;font-size:13px;text-shadow:0 0 10px rgba(255,255,255,.4)}
.scorebar{height:64px;display:flex;align-items:center;justify-content:space-between}
.lbl{font-size:11px;font-weight:800;letter-spacing:.2em;color:#a99be8}
#score{font-size:42px;line-height:1;font-weight:900;text-shadow:0 0 18px rgba(25,230,255,.7),0 3px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
#score.bump{animation:bump .3s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18);color:#ffe45c}100%{transform:scale(1)}}
.badge{padding:7px 14px;border-radius:14px;background:rgba(255,210,31,.1);border:1px solid rgba(255,210,31,.5);display:flex;flex-direction:column;align-items:flex-end;gap:2px;box-shadow:0 0 16px rgba(255,210,31,.15)}
.badge .lbl{color:#ffd21f}
#badgeVal{font-weight:900;font-size:19px;color:#ffe680;font-variant-numeric:tabular-nums}
.goal{height:30px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.goal-bar{height:9px;border-radius:9px;background:rgba(255,255,255,.09);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
#goalFill{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#19e6ff,#8b3dff,#ff2fb3);box-shadow:0 0 10px rgba(25,230,255,.7);transition:width .4s ease}
#goalText{text-align:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:#c9beff}

#board{display:grid;grid-template-columns:repeat(8,var(--cell,44px));grid-template-rows:repeat(8,var(--cell,44px));gap:3px;padding:6px;border-radius:18px;background:linear-gradient(160deg,rgba(34,22,100,.9),rgba(10,6,40,.95));border:2px solid rgba(140,110,255,.4);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 40px rgba(120,70,255,.35),inset 0 0 30px rgba(0,0,0,.55);touch-action:none;transition:filter .6s}
#board.dead{filter:grayscale(.85) brightness(.6)}
.cell{position:relative;width:var(--cell,44px);height:var(--cell,44px);border-radius:22%;background:rgba(255,255,255,.05);box-shadow:inset 0 1px 3px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04)}
.cell.ghost::after{content:'';position:absolute;inset:0;border-radius:22%;background:var(--gc,#fff);opacity:.5;box-shadow:inset 0 0 0 2px rgba(255,255,255,.65),0 0 12px var(--gc,#fff);z-index:2}
.cell.hl::before{content:'';position:absolute;inset:-1px;border-radius:26%;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 14px 3px var(--gc,#fff);animation:hlp .45s ease-in-out infinite alternate;z-index:3;pointer-events:none}
.cell.hl .blk.on{filter:brightness(1.4) saturate(1.2)}
.cell.hl.ghost::after{opacity:.9;animation:hlp .45s ease-in-out infinite alternate}
@keyframes hlp{from{opacity:.55}to{opacity:1}}
.blk.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.blk.clearing{animation:clr .3s ease-in forwards}
@keyframes clr{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.2);filter:brightness(2.4)}100%{transform:scale(.1);opacity:0;filter:brightness(3)}}
.blk.hit{animation:hit .3s ease-in-out}
@keyframes hit{0%,100%{transform:translate(0);filter:brightness(1)}25%{transform:translate(-3px,1px);filter:brightness(1.8)}75%{transform:translate(3px,-1px);filter:brightness(1.8)}}

#tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:calc(var(--cell,44px)*2.7 + 16px)}
.slot{display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);touch-action:none;cursor:grab;position:relative}
.slot.empty{opacity:.3;cursor:default}
.slot.dragging .piece{opacity:.15}
.slot.nope{animation:nope .3s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.slot.enter .piece{animation:slotIn .45s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0s)}
@keyframes slotIn{from{transform:translateY(40px) scale(.5);opacity:0}to{transform:none;opacity:1}}
.piece{display:grid;pointer-events:none}
.pc{position:relative}
#dragLayer{position:fixed;inset:0;pointer-events:none;z-index:200}
.float{position:fixed;left:0;top:0;pointer-events:none;will-change:transform}
.float .piece{filter:drop-shadow(0 14px 12px rgba(0,0,0,.55));animation:lift .14s ease-out both;transform-origin:50% 60%}
@keyframes lift{from{transform:scale(.62)}to{transform:scale(1)}}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#floats{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.ft{position:fixed;transform:translate(-50%,-50%);font-weight:900;white-space:nowrap;pointer-events:none;animation:ftUp 1.25s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 18px currentColor}
.ft.pts{font-size:36px;color:#ffe45c}
.ft.praise{font-size:32px;color:#ff5fd0;letter-spacing:.06em}
.ft.combo{font-size:25px;color:#4df0ff;letter-spacing:.05em}
.ft.sub{font-size:15px;color:#d8ceff;letter-spacing:.1em}
@keyframes ftUp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-60%) scale(1.25);opacity:1}30%{transform:translate(-50%,-65%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(calc(var(--sk,1)*-5px),calc(var(--sk,1)*3px)) rotate(-.3deg)}30%{transform:translate(calc(var(--sk,1)*5px),calc(var(--sk,1)*-3px)) rotate(.3deg)}45%{transform:translate(calc(var(--sk,1)*-4px),calc(var(--sk,1)*-2px))}60%{transform:translate(calc(var(--sk,1)*4px),calc(var(--sk,1)*2px))}80%{transform:translate(calc(var(--sk,1)*-2px),calc(var(--sk,1)*1px))}}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,3,20,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:100;padding:16px}
.modal.show{display:flex;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:min(94vw,420px);max-height:92dvh;padding:24px 20px;border-radius:26px;background:linear-gradient(160deg,#2a1a70,#130b3a);border:1px solid rgba(170,140,255,.4);box-shadow:0 0 60px rgba(120,70,255,.45),0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15);text-align:center;animation:panelIn .35s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column;gap:14px}
@keyframes panelIn{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:0;font-size:28px;font-weight:900;letter-spacing:.1em;background:linear-gradient(90deg,#4df0ff,#ff5fd0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(150,110,255,.6))}
.panel p{margin:0;color:#cfc5ff;font-size:14px;line-height:1.4}
.panel .btns{display:flex;flex-direction:column;gap:12px}
.panel .row{display:flex;gap:10px}
.panel .row .btn{flex:1}
.statbox{display:flex;justify-content:center;gap:12px}
.stat{flex:1;padding:10px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1)}
.stat b{display:block;font-size:26px;font-weight:900;color:#ffe680;font-variant-numeric:tabular-nums}
.newbest{display:inline-block;margin:0 auto;padding:4px 14px;border-radius:999px;background:linear-gradient(90deg,#ffe35c,#ff8a1f);color:#3a2000;font-weight:900;letter-spacing:.14em;font-size:12px;animation:bump .8s ease-in-out infinite}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:4px 2px}
.lv{position:relative;aspect-ratio:1/1.08;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(160deg,#5a3fd6,#2e1c8a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.lv:active:not(:disabled){transform:translateY(2px)}
.lv .n{font-size:20px;font-weight:900;line-height:1}
.lv .st{display:flex;gap:1px}
.lv .st svg{width:12px;height:12px;fill:rgba(255,255,255,.2)}
.lv .st svg.f{fill:#ffd21f;filter:drop-shadow(0 0 3px rgba(255,210,31,.8))}
.lv .tg{position:absolute;top:3px;right:5px;font-size:10px;opacity:.85}
.lv:disabled{opacity:.45;background:linear-gradient(160deg,#2b2757,#1a1738);cursor:not-allowed}
.lv:disabled svg.lk{width:16px;height:16px;fill:none;color:#a89fd8}
.lv.cur{animation:curGlow 1.2s ease-in-out infinite alternate;border-color:#ffe35c}
@keyframes curGlow{from{box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 4px rgba(255,227,92,.4)}to{box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 18px rgba(255,227,92,.9)}}
.bigstars{display:flex;justify-content:center;gap:6px;margin:4px 0}
.bigstar{width:72px;height:72px;transform:scale(0)}
.bigstar svg{width:100%;height:100%;fill:#ffd21f}
.bigstar.earned{animation:starIn .65s cubic-bezier(.2,1.7,.4,1) forwards;animation-delay:var(--d);filter:drop-shadow(0 0 14px rgba(255,210,31,.9))}
.bigstar.no{animation:starNo .4s ease-out forwards;animation-delay:var(--d)}
.bigstar.no svg{fill:#4a4478}
.bigstar:nth-child(2){margin-top:-12px}
@keyframes starIn{0%{transform:scale(0) rotate(-120deg)}100%{transform:scale(1) rotate(0)}}
@keyframes starNo{to{transform:scale(.85)}}
.hint{font-size:12px!important;color:#9a8fd6!important}
@media (max-height:620px){.panel{padding:16px 16px;gap:10px}.panel h2{font-size:22px}.bigstar{width:56px;height:56px}}
</style>
</head>
<body>
<div id="app">
  <!-- MAIN MENU -->
  <section id="menu" class="screen">
    <div id="bgBlocks"></div>
    <button class="icon-btn menu-sound sndBtn" aria-label="Toggle sound"></button>
    <div class="menu-inner">
      <div id="logo"></div>
      <p class="tagline">DRAG · DROP · BURST</p>
      <div class="menu-btns">
        <button class="btn primary" id="btnEndless">PLAY ENDLESS<small id="endlessBest">BEST 0</small></button>
        <button class="btn cyan" id="btnCampaign">CAMPAIGN (30 LEVELS)<small id="campStars">0 / 90 STARS</small></button>
        <button class="btn ghost" id="btnReset">RESET PROGRESS</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen hidden">
    <header class="hud-top">
      <button class="icon-btn" id="btnPause" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      </button>
      <div class="chip" id="levelChip">ENDLESS</div>
      <button class="icon-btn sndBtn" aria-label="Toggle sound"></button>
    </header>
    <div class="scorebar">
      <div><div class="lbl">SCORE</div><div id="score">0</div></div>
      <div class="badge"><span class="lbl" id="badgeLbl">BEST</span><span id="badgeVal">0</span></div>
    </div>
    <div class="goal"><div class="goal-bar"><i id="goalFill"></i></div><div id="goalText"></div></div>
    <div id="board"></div>
    <div id="tray">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div>
  </section>
</div>

<canvas id="fx"></canvas>
<div id="floats"></div>
<div id="dragLayer"></div>

<!-- MODALS -->
<div class="modal" id="mLevels">
  <div class="panel">
    <h2>SELECT LEVEL</h2>
    <p id="lvTotal">0 / 90 stars</p>
    <div class="scroll" style="max-height:56dvh"><div class="lvgrid" id="lvGrid"></div></div>
    <p class="hint">❄ = obstacle level · 3 stars for using few pieces</p>
    <button class="btn ghost" id="btnLvBack">BACK</button>
  </div>
</div>

<div class="modal" id="mPause">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="btns">
      <button class="btn cyan" id="btnResume">RESUME</button>
      <button class="btn sm" id="btnRestart">RESTART</button>
      <button class="btn ghost" id="btnPauseSound">SOUND: ON</button>
      <button class="btn ghost" id="btnQuit">QUIT TO MENU</button>
    </div>
  </div>
</div>

<div class="modal" id="mOver">
  <div class="panel">
    <h2 id="overTitle">GAME OVER</h2>
    <p id="overSub">No more moves.</p>
    <div class="statbox">
      <div class="stat"><span class="lbl">SCORE</span><b id="overScore">0</b></div>
      <div class="stat"><span class="lbl" id="overLbl2">BEST</span><b id="overBest">0</b></div>
    </div>
    <div id="overNew"></div>
    <div class="btns">
      <button class="btn primary" id="btnRetry">TRY AGAIN</button>
      <button class="btn ghost" id="btnOverLevels">LEVELS</button>
      <button class="btn ghost" id="btnOverMenu">MAIN MENU</button>
    </div>
  </div>
</div>

<div class="modal" id="mWin">

<script>
(() => {
'use strict';

/* =====================================================================
   CONSTANTS & DATA
   ===================================================================== */
const N = 8, GAP = 3, TGAP = 2;
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString();
const PAL = {
  cyan:{c:'#19e6ff',l:'#c4f9ff',d:'#0a8fb0'},
  magenta:{c:'#ff2fb3',l:'#ffa6df',d:'#a0087a'},
  yellow:{c:'#ffd21f',l:'#fff3a8',d:'#c28a00'},
  green:{c:'#3dff7a',l:'#c4ffd6',d:'#0f9a3c'},
  orange:{c:'#ff8a1f',l:'#ffd3a6',d:'#b84a00'},
  violet:{c:'#8b3dff',l:'#d3afff',d:'#4a12b0'},
  blue:{c:'#3a6bff',l:'#adc3ff',d:'#1636b0'}
};
const PAL_KEYS = Object.keys(PAL);

/* ---------- shape generation ---------- */
function parse(rows){const cells=[];rows.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='X')cells.push([r,c]);}));return cells;}
function norm(cells){const mr=Math.min(...cells.map(x=>x[0])),mc=Math.min(...cells.map(x=>x[1]));return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);}
function rot(cells){return norm(cells.map(([r,c])=>[c,-r]));}
function ckey(cells){return cells.map(x=>x.join(',')).join(';');}
const FAMILIES = [
  {id:'dot',rows:['X'],color:'yellow',w:1,hw:.3},
  {id:'i2',rows:['XX'],color:'green',w:3,hw:1.5},
  {id:'i3',rows:['XXX'],color:'cyan',w:3,hw:2},
  {id:'i4',rows:['XXXX'],color:'blue',w:1.6,hw:1.6},
  {id:'o2',rows:['XX','XX'],color:'orange',w:3,hw:2},
  {id:'o3',rows:['XXX','XXX','XXX'],color:'violet',w:1,hw:1.6},
  {id:'r23',rows:['XXX','XXX'],color:'magenta',w:1,hw:1.2},
  {id:'c3',rows:['XX','X.'],color:'green',w:3,hw:2.5},
  {id:'l4',rows:['X.','X.','XX'],color:'yellow',w:2,hw:2.5},
  {id:'j4',rows:['.X','.X','XX'],color:'cyan',w:2,hw:2.5},
  {id:'bl',rows:['X..','X..','XXX'],color:'magenta',w:.8,hw:1.5},
  {id:'t4',rows:['XXX','.X.'],color:'violet',w:2,hw:2.5},
  {id:'s4',rows:['.XX','XX.'],color:'green',w:1.5,hw:2.6},
  {id:'z4',rows:['XX.','.XX'],color:'orange',w:1.5,hw:2.6}
];
const SHAPES = [];
FAMILIES.forEach(f => {
  let cur = norm(parse(f.rows)); const seen = new Set(), vars = [];
  for (let i=0;i<4;i++){ const k=ckey(cur); if(!seen.has(k)){seen.add(k);vars.push(cur);} cur=rot(cur); }
  vars.forEach((cells,i) => SHAPES.push({
    id:f.id+i, cells, n:cells.length,
    h:Math.max(...cells.map(x=>x[0]))+1, w:Math.max(...cells.map(x=>x[1]))+1,
    color:f.color, w0:f.w/vars.length, w1:f.hw/vars.length
  }));
});

/* ---------- obstacle patterns & 30 levels ---------- */
const PATTERNS = {
  corners:(r,c)=>(r<2||r>5)&&(c<2||c>5),
  center:(r,c)=>r>=3&&r<=4&&c>=3&&c<=4,
  center4:(r,c)=>r>=2&&r<=5&&c>=2&&c<=5,
  diag:(r,c)=>r===c,
  xdiag:(r,c)=>r===c||r+c===7,
  checker:(r,c)=>r>=2&&r<=5&&c>=2&&c<=5&&(r+c)%2===0,
  stripes:(r,c)=>(r===2||r===5)&&c>=1&&c<=6,
  frame:(r,c)=>(r===0||r===7||c===0||c===7)&&(r+c)%2===0,
  cross:(r,c)=>((r===3||r===4)&&(c<2||c>5))||((c===3||c===4)&&(r<2||r>5)),
  scatter:(r,c)=>(r*3+c*5)%7===0,
  scatter2:(r,c)=>(r*7+c*4)%9===0
};
const LEVELS = [
  {t:'score',v:300},
  {t:'score',v:600},
  {t:'lines',v:6},
  {t:'score',v:1000},
  {t:'clear',ob:[{p:'scatter',k:'I'}]},
  {t:'lines',v:9},
  {t:'score',v:1500,ob:[{p:'corners',k:'I'}]},
  {t:'clear',ob:[{p:'corners',k:'I'}]},
  {t:'lines',v:12},
  {t:'clear',ob:[{p:'diag',k:'I'}]},
  {t:'score',v:2200,ob:[{p:'scatter2',k:'I'}]},
  {t:'clear',ob:[{p:'scatter',k:'S'}]},
  {t:'lines',v:14},
  {t:'score',v:3000,ob:[{p:'frame',k:'I'}]},
  {t:'clear',ob:[{p:'checker',k:'I'}]},
  {t:'lines',v:16,ob:[{p:'scatter',k:'I'}]},
  {t:'score',v:4000},
  {t:'clear',ob:[{p:'stripes',k:'S'}]},
  {t:'lines',v:18,ob:[{p:'scatter2',k:'S'}]},
  {t:'clear',ob:[{p:'center4',k:'I'}]},
  {t:'score',v:5000,ob:[{p:'checker',k:'S'}]},
  {t:'clear',ob:[{p:'diag',k:'S'}]},
  {t:'lines',v:22},
  {t:'clear',ob:[{p:'frame',k:'I'}]},
  {t:'score',v:6500,ob:[{p:'scatter',k:'S'}]},
  {t:'clear',ob:[{p:'cross',k:'I'}]},
  {t:'lines',v:26,ob:[{p:'corners',k:'I'}]},
  {t:'clear',ob:[{p:'center',k:'S'},{p:'corners',k:'I'}]},
  {t:'score',v:9000,ob:[{p:'scatter2',k:'S'}]},
  {t:'clear',ob:[{p:'xdiag',k:'I'},{p:'scatter',k:'S'}]}
];

/* =====================================================================
   SAVE DATA
   ===================================================================== */
const KEY = 'blockburst.save.v1';
let SAVE = {best:0,unlocked:1,stars:new Array(30).fill(0),sound:true};
function loadSave(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(typeof o.best==='number') SAVE.best=o.best;
    if(typeof o.unlocked==='number') SAVE.unlocked=Math.min(30,Math.max(1,o.unlocked|0));
    if(Array.isArray(o.stars)) SAVE.stars=SAVE.stars.map((_,i)=>Math.min(3,Math.max(0,o.stars[i]|0)));
    if(typeof o.sound==='boolean') SAVE.sound=o.sound;
  }catch(e){}
}
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(SAVE)); }catch(e){} }
loadSave();

/* =====================================================================
   AUDIO (Web Audio API, fully procedural)
   ===================================================================== */
let actx=null, master=null;
function ensureAudio(){
  if(!actx){
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      if(AC){ actx=new AC(); master=actx.createGain(); master.gain.value=.55; master.connect(actx.destination); }
    }catch(e){ actx=null; }
  }
  if(actx && actx.state==='suspended'){ actx.resume().catch(()=>{}); }
}
function tone(o){
  if(!SAVE.sound||!actx) return;
  const d=o.d||.15, v=o.v||.2, t=actx.currentTime+(o.t||0);
  const osc=actx.createOscillator(), g=actx.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+d);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g); g.connect(master);
  osc.start(t); osc.stop(t+d+.05);
}
const sfx = {
  pick(){ tone({f:720,f2:1250,d:.07,v:.16}); },
  ui(){ tone({f:520,f2:780,d:.06,v:.12}); },
  drop(){ tone({f:170,f2:48,d:.22,v:.65}); tone({f:300,f2:90,d:.05,type:'square',v:.07}); },
  nope(){ tone({f:200,f2:130,d:.12,type:'triangle',v:.12}); },
  clear(lines,streak){
    const base = 392*Math.pow(2,Math.min(streak-1,8)*2/12);
    const ratios=[1,1.25,1.5,2,2.5,3];
    const n=Math.min(ratios.length,2+lines);
    for(let i=0;i<n;i++){
      tone({f:base*ratios[i],d:.3,type:'triangle',v:.2,t:i*.06});
      tone({f:base*ratios[i]*2,d:.22,type:'sine',v:.07,t:i*.06});
    }
    if(streak>=2){
      const b2=base*1.3348;
      [1,1.25,1.5,2].forEach((r,i)=>tone({f:b2*r,d:.3,type:'triangle',v:.16,t:.3+i*.05}));
    }
    if(streak>=3){
      const b3=base*1.5;
      [1,1.25,1.5,2,2.5].forEach((r,i)=>tone({f:b3*r,d:.34,type:'sine',v:.15,t:.58+i*.045}));
    }
  },
  win(){
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{ tone({f,d:.3,type:'triangle',v:.22,t:i*.12}); tone({f:f*2,d:.2,v:.06,t:i*.12}); });
    [523.25,659.25,783.99,1046.5].forEach(f=>tone({f,d:.9,type:'sine',v:.14,t:.65}));
  },
  over(){
    [293.66,349.23,440].forEach((f,i)=>tone({f,f2:f*.5,d:1.0,type:'sawtooth',v:.1,t:i*.04}));
    tone({f:110,f2:55,d:1.1,type:'sine',v:.3});
  }
};
function vib(p){ if(typeof navigator.vibrate==='function'){ try{navigator.vibrate(p);}catch(e){} } }

/* =====================================================================
   DOM REFS & LAYOUT
   ===================================================================== */
const root=document.documentElement;
const gameEl=$('game'), menuEl=$('menu'), boardEl=$('board'), trayEl=$('tray');
const slotEls=[...trayEl.querySelectorAll('.slot')];
const scoreEl=$('score'), dragLayer=$('dragLayer'), floatsEl=$('floats');
const cellEls=[], blkEls=[];
for(let i=0;i<N*N;i++){
  const c=document.createElement('div'); c.className='cell';
  const b=document.createElement('div'); b.className='blk';
  c.appendChild(b); boardEl.appendChild(c); cellEls.push(c); blkEls.push(b);
}
let TC=24;
function layout(){
  const W=window.innerWidth,H=window.innerHeight;
  const cw=(W-24-37)/8, ch=(H-255)/10.7;
  const c=Math.floor(Math.max(22,Math.min(cw,ch,56)));
  root.style.setProperty('--cell',c+'px');
  root.style.setProperty('--bw',(8*c+37)+'px');
  TC=Math.max(12,Math.floor(c*.58));
  if(drag) cancelDrag();
  renderTray(false);
  resizeCanvas();
}

/* =====================================================================
   GAME STATE
   ===================================================================== */
const G={mode:'endless',level:1,grid:[],slots:[null,null,null],score:0,lines:0,moves:0,streak:0,noClear:0,obTotal:0,obLeft:0,busy:false,paused:false,over:false,running:false};
function emptyGrid(){ return Array.from({length:N},()=>new Array(N).fill(null)); }

function canPlace(shape,r,c,grid){
  grid=grid||G.grid;
  for(let i=0;i<shape.cells.length;i++){
    const rr=r+shape.cells[i][0], cc=c+shape.cells[i][1];
    if(rr<0||cc<0||rr>=N||cc>=N||grid[rr][cc]) return false;
  }
  return true;
}
function fitsAnywhere(shape,grid){
  for(let r=0;r<=N-shape.h;r++) for(let c=0;c<=N-shape.w;c++) if(canPlace(shape,r,c,grid)) return true;
  return false;
}
function anyFit(){
  for(const s of G.slots){ if(s && fitsAnywhere(s)) return true; }
  return false;
}
function findFull(occ){
  const rows=[],cols=[];
  for(let r=0;r<N;r++){ let f=true; for(let c=0;c<N;c++) if(!occ[r][c]){f=false;break;} if(f) rows.push(r); }
  for(let c=0;c<N;c++){ let f=true; for(let r=0;r<N;r++) if(!occ[r][c]){f=false;break;} if(f) cols.push(c); }
  return {rows,cols};
}
function currentDiff(){
  let d;
  if(G.mode==='campaign') d=(G.level-1)/29*.9; else d=Math.min(.8,G.score/10000);
  let filled=0; G.grid.forEach(row=>row.forEach(x=>{if(x)filled++;}));
  if(filled/(N*N)>.55) d*=.5;
  return d;
}
function pickShape(diff){
  let total=0; const ws=SHAPES.map(s=>{const w=s.w0+(s.w1-s.w0)*diff;total+=w;return w;});
  let x=Math.random()*total;
  for(let i=0;i<SHAPES.length;i++){ x-=ws[i]; if(x<=0) return SHAPES[i]; }
  return SHAPES[SHAPES.length-1];
}
function newSet(){
  const diff=currentDiff();
  for(let t=0;t<60;t++){
    const s=[pickShape(diff),pickShape(diff),pickShape(diff)];
    if(s.some(sh=>fitsAnywhere(sh))) return s;
  }
  return [pickShape(0),pickShape(0),pickShape(0)];
}

/* =====================================================================
   RENDERING
   ===================================================================== */
function setVars(el,colorKey){ const p=PAL[colorKey]; el.style.setProperty('--c',p.c); el.style.setProperty('--l',p.l); el.style.setProperty('--d',p.d); }
function renderBoard(pop){
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i=r*N+c, g=G.grid[r][c], b=blkEls[i];
    if(!g){ b.className='blk'; continue; }
    let cls='blk on';
    if(g.type==='ice') cls+=' ice';
    else if(g.type==='stone') cls+=' stone'+(g.hp<2?' cracked':'');
    if(pop&&pop.has(i)) cls+=' pop';
    b.className=cls;
    if(g.type==='block') setVars(b,g.color);
  }
}
function makePiece(shape,size,gap){
  const p=document.createElement('div'); p.className='piece';
  p.style.gridTemplateColumns=`repeat(${shape.w},${size}px)`;
  p.style.gridTemplateRows=`repeat(${shape.h},${size}px)`;
  p.style.gap=gap+'px';
  const set=new Set(shape.cells.map(([r,c])=>r*shape.w+c));
  for(let r=0;r<shape.h;r++) for(let c=0;c<shape.w;c++){
    const d=document.createElement('div'); d.className='pc';
    if(set.has(r*shape.w+c)){ const b=document.createElement('div'); b.className='blk on'; setVars(b,shape.color); d.appendChild(b); }
    p.appendChild(d);
  }
  return p;
}
function renderTray(anim){
  slotEls.forEach((el,i)=>{
    el.innerHTML=''; el.classList.remove('dragging','enter','empty');
    const s=G.slots[i];
    if(!s){ el.classList.add('empty'); return; }
    el.appendChild(makePiece(s,TC,TGAP));
    if(anim){ el.style.setProperty('--d',(i*.08)+'s'); el.classList.add('enter'); }
  });
}
let shown=0, twRaf=0;
function animateScore(){
  const to=G.score;
  if(twRaf){ cancelAnimationFrame(twRaf); twRaf=0; }
  const from=shown;
  if(from===to){ scoreEl.textContent=fmt(to); return; }
  scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
  const t0=performance.now(), dur=Math.min(600,200+Math.abs(to-from)*.8);
  const step=t=>{
    const k=Math.min(1,(t-t0)/dur);
    shown=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    scoreEl.textContent=fmt(shown);
    if(k<1) twRaf=requestAnimationFrame(step); else { twRaf=0; shown=to; }
  };
  twRaf=requestAnimationFrame(step);
}
function goalLabel(L){
  if(L.t==='score') return `Reach ${fmt(L.v)} points`;
  if(L.t==='lines') return `Clear ${L.v} lines`;
  return 'Shatter all ice & stone';
}
function updateHud(){
  animateScore();
  const fill=$('goalFill');
  if(G.mode==='endless'){
    $('badgeLbl').textContent='BEST';
    $('badgeVal').textContent=fmt(Math.max(SAVE.best,G.score));
    const b=Math.max(SAVE.best,1);
    fill.style.width=Math.min(100,G.score/b*100)+'%';
    $('goalText').textContent=`Lines ${G.lines} · Pieces ${G.moves}`;
  }else{
    const L=LEVELS[G.level-1];
    $('badgeLbl').textContent='GOAL';
    let prog=0,txt='';
    if(L.t==='score'){ $('badgeVal').textContent=fmt(L.v); prog=G.score/L.v; txt=`${fmt(Math.min(G.score,L.v))} / ${fmt(L.v)} pts`; }
    else if(L.t==='lines'){ $('badgeVal').textContent=L.v+' LINES'; prog=G.lines/L.v; txt=`${Math.min(G.lines,L.v)} / ${L.v} lines`; }
    else { $('badgeVal').textContent='CLEAR ALL'; prog=G.obTotal?(G.obTotal-G.obLeft)/G.obTotal:1; txt=`${G.obTotal-G.obLeft} / ${G.obTotal} obstacles shattered`; }
    fill.style.width=Math.min(100,prog*100)+'%';
    $('goalText').textContent=`${txt} · Pieces ${G.moves}`;
  }
}

/* ---------- preview (ghost + highlights) ---------- */
let pv=[], pvKey='';
function clearPreview(){
  pv.forEach(i=>{ cellEls[i].classList.remove('ghost','hl'); });
  pv=[]; pvKey='';
}
function showPreview(t,shape){
  pv.forEach(i=>{ cellEls[i].classList.remove('ghost','hl'); });
  pv=[];
  if(!t) return;
  const col=PAL[shape.color].c;
  const occ=G.grid.map(row=>row.map(x=>!!x));
  shape.cells.forEach(([dr,dc])=>{
    const rr=t.r+dr, cc=t.c+dc, i=rr*N+cc;
    occ[rr][cc]=true;
    cellEls[i].classList.add('ghost'); cellEls[i].style.setProperty('--gc',col); pv.push(i);
  });
  const f=findFull(occ);
  const mark=i=>{ cellEls[i].classList.add('hl'); cellEls[i].style.setProperty('--gc',col); pv.push(i); };
  f.rows.forEach(r=>{ for(let c=0;c<N;c++) mark(r*N+c); });
  f.cols.forEach(c=>{ for(let r=0;r<N;r++) mark(r*N+c); });
}

/* =====================================================================
   PARTICLES
   ===================================================================== */
const cv=$('fx'), cx=cv.getContext('2d');
let DPR=1, parts=[], pRaf=0, pLast=0;
function resizeCanvas(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=Math.floor(innerWidth*DPR); cv.height=Math.floor(innerHeight*DPR); }
function burst(x,y,color,n,power){
  n=n||14; power=power||1;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(70+Math.random()*280)*power;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,life:0,max:.45+Math.random()*.65,size:2+Math.random()*4.5,col:color});
  }
  if(parts.length>1800) parts.splice(0,parts.length-1800);
  if(!pRaf){ pLast=performance.now(); pRaf=requestAnimationFrame(pLoop); }
}
function pLoop(t){
  const dt=Math.min(.035,(t-pLast)/1000); pLast=t;
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,innerWidth,innerHeight);
  cx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life+=dt;
    if(p.life>=p.max){ parts.splice(i,1); continue; }
    p.vy+=520*dt; p.vx*=.985; p.x+=p.vx*dt; p.y+=p.vy*dt;
    const a=1-p.life/p.max, s=p.size*(.5+.5*a);
    cx.fillStyle=p.col; cx.globalAlpha=a*.28; cx.beginPath(); cx.arc(p.x,p.y,s*2.8,0,6.2832); cx.fill();
    cx.globalAlpha=a; cx.beginPath(); cx.arc(p.x,p.y,s,0,6.2832); cx.fill();
    cx.fillStyle='#fff'; cx.globalAlpha=a*.7; cx.beginPath(); cx.arc(p.x,p.y,s*.4,0,6.2832); cx.fill();
  }
  cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
  if(parts.length) pRaf=requestAnimationFrame(pLoop); else { pRaf=0; cx.clearRect(0,0,innerWidth,innerHeight); }
}
function confetti(){
  for(let k=0;k<14;k++){
    setTimeout(()=>{
      const x=innerWidth*(.1+Math.random()*.8), y=innerHeight*(.2+Math.random()*.35);
      burst(x,y,PAL[PAL_KEYS[k%7]].c,40,1.3);
    },k*110);
  }
}
function floatText(text,x,y,cls,delay){
  const d=document.createElement('div'); d.className='ft '+cls; d.textContent=text;
  d.style.left=x+'px'; d.style.top=y+'px';
  if(delay) d.style.animationDelay=delay+'s';
  floatsEl.appendChild(d);
  setTimeout(()=>d.remove(),1500+(delay||0)*1000);
}
function shake(k){
  gameEl.style.setProperty('--sk',k);
  gameEl.classList.remove('shake'); void gameEl.offsetWidth; gameEl.classList.add('shake');
  setTimeout(()=>gameEl.classList.remove('shake'),450);
}
function cellCenter(i){ const r=cellEls[i].getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2}; }
function boardCenter(){ const r=boardEl.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2,top:r.top,h:r.height}; }

/* =====================================================================
   DRAG & DROP (Pointer Events)
   ===================================================================== */
let drag=null;
function measure(){
  const r0=cellEls[0].getBoundingClientRect(), r1=cellEls[1].getBoundingClientRect();
  return {x:r0.left,y:r0.top,cell:r0.width,pitch:r1.left-r0.left};
}
function findTarget(shape,fr,fc){
  let best=null,bd=1.35;
  const r0=Math.max(0,Math.floor(fr)-1), r1=Math.min(N-shape.h,Math.ceil(fr)+1);
  const c0=Math.max(0,Math.floor(fc)-1), c1=Math.min(N-shape.w,Math.ceil(fc)+1);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(!canPlace(shape,r,c)) continue;
    const d=Math.hypot(c-fc,r-fr);
    if(d<bd){bd=d;best={r,c};}
  }
  return best;
}
function moveDrag(x,y){
  const m=measure();
  const off=Math.max(66,drag.h/2+12);
  const left=x-drag.w/2, top=(y-off)-drag.h/2;
  drag.fl.style.transform=`translate3d(${left}px,${top}px,0)`;
  const fc=(left-m.x)/m.pitch, fr=(top-m.y)/m.pitch;
  const t=findTarget(drag.shape,fr,fc);
  const key=t?t.r+','+t.c:'';
  if(key!==drag.key){ drag.key=key; drag.target=t; showPreview(t,drag.shape); }
}
function onDown(e,i){
  if(drag||G.busy||G.paused||G.over||!G.running) return;
  const shape=G.slots[i]; if(!shape) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  ensureAudio();
  try{ slotEls[i].setPointerCapture(e.pointerId); }catch(_){}
  const m=measure();
  const fl=document.createElement('div'); fl.className='float';
  fl.appendChild(makePiece(shape,m.cell,GAP));
  dragLayer.appendChild(fl);
  drag={i,shape,pid:e.pointerId,fl,w:shape.w*m.pitch-GAP,h:shape.h*m.pitch-GAP,target:null,key:'#'};
  slotEls[i].classList.add('dragging');
  sfx.pick();
  moveDrag(e.clientX,e.clientY);
}
function onMove(e){
  if(!drag||e.pointerId!==drag.pid) return;
  e.preventDefault();
  moveDrag(e.clientX,e.clientY);
}
function endDrag(){
  if(!drag) return;
  const d=drag; drag=null;
  d.fl.remove();
  slotEls[d.i].classList.remove('dragging');
  try{ slotEls[d.i].releasePointerCapture(d.pid); }catch(_){}
  clearPreview();
}
function cancelDrag(){ endDrag(); }
function onUp(e){
  if(!drag||e.pointerId!==drag.pid) return;
  moveDrag(e.clientX,e.clientY);
  const d=drag;
  endDrag();
  if(d.target){ place(d.i,d.shape,d.target.r,d.target.c); }
  else{
    sfx.nope();
    const s=slotEls[d.i]; s.classList.remove('nope'); void s.offsetWidth; s.classList.add('nope');
  }
}
slotEls.forEach((el,i)=>{
  el.addEventListener('pointerdown',e=>onDown(e,i));
  el.addEventListener('pointermove',onMove);
  el.addEventListener('pointerup',onUp);
  el.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.pid) cancelDrag(); });
  el.addEventListener('lostpointercapture',e=>{ if(drag&&e.pointerId===drag.pid&&drag.i===i) cancelDrag(); });
});

/* =====================================================================
   CORE GAME FLOW
   ===================================================================== */
function addScore(n){
  G.score+=n;
  if(G.mode==='endless'&&G.score>SAVE.best){ SAVE.best=G.score; G.newBest=true; }
}
function place(idx,shape,r,c){
  G.busy=true;
  const pop=new Set();
  shape.cells.forEach(([dr,dc])=>{ G.grid[r+dr][c+dc]={type:'block',color:shape.color}; pop.add((r+dr)*N+c+dc); });
  G.slots[idx]=null; G.moves++;
  addScore(shape.n);
  sfx.drop(); vib([15]);
  renderBoard(pop); renderTray(false);
  const f=findFull(G.grid), total=f.rows.length+f.cols.length;
  if(total>0) doClear(f,total);
  else{ G.noClear++; if(G.noClear>=3) G.streak=0; settle(); }
}
function doClear(f,total){
  G.noClear=0; G.streak++; G.lines+=total;
  const set=new Set();
  f.rows.forEach(r=>{ for(let c=0;c<N;c++) set.add(r*N+c); });
  f.cols.forEach(c=>{ for(let r=0;r<N;r++) set.add(r*N+c); });
  const remove=[],crack=[];
  set.forEach(i=>{ const g=G.grid[(i/N)|0][i%N]; if(g.type==='stone'&&g.hp>1) crack.push(i); else remove.push(i); });
  const obRemoved=remove.filter(i=>G.grid[(i/N)|0][i%N].type!=='block').length;
  const base=100*total*(total+1)/2;
  const mult=1+(G.streak-1)*.5;
  const pts=Math.round(base*mult)+obRemoved*25;
  addScore(pts);
  let cxs=0,cys=0;
  remove.forEach(i=>{
    const g=G.grid[(i/N)|0][i%N];
    const col=g.type==='block'?PAL[g.color].c:(g.type==='ice'?'#aef0ff':'#b4b9cc');
    const p=cellCenter(i); cxs+=p.x; cys+=p.y;
    blkEls[i].classList.add('clearing');
    burst(p.x,p.y,col,g.type==='block'?13:16,1+total*.12);
  });
  crack.forEach(i=>{
    const p=cellCenter(i); cxs+=p.x; cys+=p.y;
    blkEls[i].classList.add('hit'); burst(p.x,p.y,'#b4b9cc',8,.7);
  });
  const cnt=remove.length+crack.length;
  const mx=cxs/cnt, my=cys/cnt, bc=boardCenter();
  sfx.clear(total,G.streak); vib([30,40,30]);
  if(total>=2||G.streak>=2) shake(total>=3||G.streak>=3?1.9:1.1);
  floatText('+'+fmt(pts),mx,my,'pts');
  const PR=['','','GREAT!','AWESOME!','INCREDIBLE!','UNBELIEVABLE!'];
  if(total>=2) floatText(PR[Math.min(total,5)],bc.x,bc.top+bc.h*.3,'praise',.05);
  if(G.streak>=2) floatText('COMBO x'+G.streak+'!',bc.x,bc.top+bc.h*.3+(total>=2?44:0),'combo',.12);
  updateHud();
  setTimeout(()=>{
    if(!G.running) return;
    remove.forEach(i=>{ const g=G.grid[(i/N)|0][i%N]; if(g&&g.type!=='block') G.obLeft--; G.grid[(i/N)|0][i%N]=null; });
    crack.forEach(i=>{ G.grid[(i/N)|0][i%N].hp--; });
    renderBoard();
    if(G.grid.every(row=>row.every(x=>!x))){
      addScore(500);
      const b=boardCenter();
      floatText('PERFECT! +500',b.x,b.y,'praise');
      for(let k=0;k<5;k++) setTimeout(()=>burst(b.x+(Math.random()-.5)*b.h*.6,b.y+(Math.random()-.5)*b.h*.6,PAL[PAL_KEYS[k]].c,30,1.2),k*80);
      sfx.win();
    }
    settle();
  },300);
}
function checkWin(){
  if(G.mode!=='campaign') return false;
  const L=LEVELS[G.level-1];
  if(L.t==='score') return G.score>=L.v;
  if(L.t==='lines') return G.lines>=L.v;
  return G.obLeft<=0;
}
function settle(){
  if(!G.running) return;
  updateHud();
  if(checkWin()){ win(); return; }
  if(G.slots.every(s=>!s)){ G.slots=newSet(); renderTray(true); }
  if(!anyFit()){ lose(); return; }
  G.busy=false;
}
function parFor(L){
  if(L.t==='score') return [Math.ceil(L.v/45)+4,Math.ceil(L.v/28)+4];
  if(L.t==='lines') return [Math.ceil(L.v*1.9),Math.ceil(L.v*3)];
  const n=G.obTotal; return [Math.ceil(6+n*1.4),Math.ceil(10+n*2.4)];
}
function win(){
  G.over=true; G.busy=true;
  const L=LEVELS[G.level-1], par=parFor(L);
  const stars=G.moves<=par[0]?3:(G.moves<=par[1]?2:1);
  const idx=G.level-1;
  if(stars>SAVE.stars[idx]) SAVE.stars[idx]=stars;
  if(G.level<30&&SAVE.unlocked<G.level+1) SAVE.unlocked=G.level+1;
  persist();
  sfx.win(); vib([30,40,30,40,60]); confetti();
  setTimeout(()=>{
    $('winTitle').textContent=G.level===30?'CAMPAIGN COMPLETE!':`LEVEL ${G.level} CLEAR!`;
    $('winScore').textContent=fmt(G.score);
    $('winMoves').textContent=G.moves;
    $('winHint').textContent=`3 stars: ${par[0]} pieces or fewer · 2 stars: ${par[1]} or fewer`;
    const box=$('winStars'); box.innerHTML='';
    for(let i=0;i<3;i++){
      const d=document.createElement('div');
      d.className='bigstar '+(i<stars?'earned':'no');
      d.style.setProperty('--d',(.3+i*.35)+'s');
      d.innerHTML=starSvg();
      box.appendChild(d);
    }
    $('btnNext').classList.toggle('hidden',G.level>=30);
    showModal('mWin');
    for(let i=0;i<stars;i++) setTimeout(()=>tone({f:660+i*220,f2:880+i*260,d:.25,type:'triangle',v:.2}),300+i*350);
  },650);
}
function lose(){
  G.over=true; G.busy=true;
  if(G.mode==='endless') persist();
  sfx.over(); vib([60,50,120]);
  boardEl.classList.add('dead');
  setTimeout(()=>{
    const camp=G.mode==='campaign';
    $('overTitle').textContent=camp?'NO MOVES LEFT':'GAME OVER';
    $('overScore').textContent=fmt(G.score);
    if(camp){
      const L=LEVELS[G.level-1];
      $('overSub').textContent=`Level ${G.level} · ${goalLabel(L)}`;
      $('overLbl2').textContent='LINES';
      $('overBest').textContent=G.lines;
      $('overNew').innerHTML='';
      $('btnOverLevels').classList.remove('hidden');
    }else{
      $('overSub').textContent='The board is full. Nothing else fits!';
      $('overLbl2').textContent='BEST';
      $('overBest').textContent=fmt(SAVE.best);
      $('overNew').innerHTML=G.newBest&&G.score>0?'<span class="newbest">NEW BEST!</span>':'';
      $('btnOverLevels').classList.add('hidden');
    }
    showModal('mOver');
  },750);
}

/* =====================================================================
   START / NAVIGATION
   ===================================================================== */
function startGame(mode,level){
  hideAllModals();
  clearPreview(); if(drag) cancelDrag();
  G.mode=mode; G.level=level||1;
  G.grid=emptyGrid(); G.score=0; G.lines=0; G.moves=0; G.streak=0; G.noClear=0;
  G.obTotal=0; G.obLeft=0; G.busy=false; G.paused=false; G.over=false; G.running=true; G.newBest=false;
  parts.length=0;
  if(mode==='campaign'){
    const L=LEVELS[G.level-1];
    (L.ob||[]).forEach(o=>{
      const f=PATTERNS[o.p];
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        if(f(r,c)&&!G.grid[r][c]){
          G.grid[r][c]=o.k==='S'?{type:'stone',hp:2}:{type:'ice',hp:1};
          G.obTotal++;
        }
      }
    });
    G.obLeft=G.obTotal;
    $('levelChip').textContent='LEVEL '+G.level;
  }else{
    $('levelChip').textContent='ENDLESS';
  }
  boardEl.classList.remove('dead');
  menuEl.classList.add('hidden'); gameEl.classList.remove('hidden');
  layout();
  shown=0; scoreEl.textContent='0';
  G.slots=newSet();
  renderBoard(); renderTray(true); updateHud();
  setTimeout(()=>{
    if(!G.running||G.moves>0) return;
    const b=boardCenter();
    if(mode==='campaign'){
      floatText('LEVEL '+G.level,b.x,b.y-14,'praise');
      floatText(goalLabel(LEVELS[G.level-1]),b.x,b.y+26,'sub',.1);
    }else{
      floatText('GO!',b.x,b.y,'praise');
    }
  },120);
}
function showMenu(){
  hideAllModals();
  if(drag) cancelDrag(); clearPreview();
  G.running=false; G.over=false;
  gameEl.classList.add('hidden'); menuEl.classList.remove('hidden');
  refreshMenu();
}
function refreshMenu(){
  $('endlessBest').textContent='BEST '+fmt(SAVE.best);
  $('campStars').textContent=SAVE.stars.reduce((a,b)=>a+b,0)+' / 90 STARS';
}

/* ---------- modals ---------- */
function showModal(id){ $(id).classList.add('show'); }
function hideModal(id){ $(id).classList.remove('show'); }
function hideAllModals(){ document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show')); }
function starSvg(){ return '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>'; }
const LOCK_SVG='<svg class="lk" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function openLevels(){
  const grid=$('lvGrid'); grid.innerHTML='';
  let total=0;
  for(let i=0;i<30;i++){
    const unlocked=(i+1)<=SAVE.unlocked, st=SAVE.stars[i]; total+=st;
    const b=document.createElement('button'); b.className='lv';
    if(unlocked&&st===0&&(i+1)===SAVE.unlocked) b.classList.add('cur');
    let html=`<span class="n">${i+1}</span>`;
    if(unlocked){
      html+='<span class="st">'+[0,1,2].map(k=>starSvg().replace('<svg','<svg class="'+(k<st?'f':'')+'"')).join('')+'</span>';
      if(LEVELS[i].t==='clear') html+='<span class="tg">❄</span>';
    }else{ html+=LOCK_SVG; b.disabled=true; }
    b.innerHTML=html;
    if(unlocked) b.addEventListener('click',()=>{ ensureAudio(); sfx.ui(); startGame('campaign',i+1); });
    grid.appendChild(b);
  }
  $('lvTotal').textContent=`${total} / 90 stars`;
  showModal('mLevels');
}
function pauseGame(){
  if(!G.running||G.over||G.paused||G.busy) return;
  if(drag) cancelDrag();
  G.paused=true; showModal('mPause');
}
function resumeGame(){ G.paused=false; hideModal('mPause'); }

/* ---------- sound UI ---------- */
const ICON_ON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="m16 9 5 6M21 9l-5 6"/></svg>';
function refreshSound(){
  document.querySelectorAll('.sndBtn').forEach(b=>{ b.innerHTML=SAVE.sound?ICON_ON:ICON_OFF; b.classList.toggle('off',!SAVE.sound); });
  $('btnPauseSound').textContent='SOUND: '+(SAVE.sound?'ON':'OFF');
}
function toggleSound(){
  SAVE.sound=!SAVE.sound; persist(); refreshSound();
  ensureAudio(); if(SAVE.sound) sfx.ui();
}

/* =====================================================================
   MENU DECORATION
   ===================================================================== */
function buildLogo(){
  const logo=$('logo'); logo.innerHTML='';
  let k=0;
  ['BLOCK','BURST'].forEach(word=>{
    const row=document.createElement('div'); row.className='logo-row';
    [...word].forEach(ch=>{
      const t=document.createElement('div'); t.className='tile';
      setVars(t,PAL_KEYS[k%7]); t.style.animationDelay=(-k*.22)+'s'; k++;
      t.innerHTML='<span>'+ch+'</span>';
      row.appendChild(t);
    });
    logo.appendChild(row);
  });
  const bg=$('bgBlocks');
  for(let i=0;i<16;i++){
    const d=document.createElement('div'); d.className='bgb';
    const s=18+Math.random()*34;
    d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${14+Math.random()*18}s;animation-delay:${-Math.random()*30}s`;
    const p=PAL[PAL_KEYS[i%7]];
    d.style.background=`linear-gradient(145deg,${p.l},${p.c} 45%,${p.d})`;
    d.style.boxShadow=`0 0 14px ${p.c}`;
    bg.appendChild(d);
  }
}

/* =====================================================================
   EVENT WIRING
   ===================================================================== */
document.addEventListener('pointerdown',ensureAudio,{passive:true});
document.addEventListener('touchmove',e=>{ if(!e.target.closest||!e.target.closest('.scroll')) e.preventDefault(); },{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,150));
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ persist(); pauseGame(); } });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(G.paused) resumeGame(); else pauseGame(); }
});

document.querySelectorAll('.sndBtn').forEach(b=>b.addEventListener('click',toggleSound));
$('btnPauseSound').addEventListener('click',toggleSound);
$('btnEndless').addEventListener('click',()=>{ ensureAudio(); sfx.ui(); startGame('endless',1); });
$('btnCampaign').addEventListener('click',()=>{ ensureAudio(); sfx.ui(); openLevels(); });
$('btnReset').addEventListener('click',()=>{ sfx.ui(); showModal('mReset'); });
$('btnResetNo').addEventListener('click',()=>hideModal('mReset'));
$('btnResetYes').addEventListener('click',()=>{
  const snd=SAVE.sound;
  SAVE={best:0,unlocked:1,stars:new Array(30).fill(0),sound:snd};
  persist(); refreshMenu(); hideModal('mReset');
});
$('btnLvBack').addEventListener('click',()=>{ hideModal('mLevels'); });
$('btnPause').addEventListener('click',()=>{ sfx.ui(); pauseGame(); });
$('btnResume').addEventListener('click',()=>{ sfx.ui(); resumeGame(); });
$('btnRestart').addEventListener('click',()=>{ sfx.ui(); startGame(G.mode,G.level); });
$('btnQuit').addEventListener('click',()=>{ sfx.ui(); showMenu(); });
$('btnRetry').addEventListener('click',()=>{ sfx.ui(); startGame(G.mode,G.level); });
$('btnOverLevels').addEventListener('click',()=>{ hideModal('mOver'); showMenu(); openLevels(); });
$('btnOverMenu').addEventListener('click',()=>{ showMenu(); });
$('btnNext').addEventListener('click',()=>{ sfx.ui(); startGame('campaign',Math.min(30,G.level+1)); });
$('btnWinReplay').addEventListener('click',()=>{ sfx.ui(); startGame('campaign',G.level); });
$('btnWinLevels').addEventListener('click',()=>{ hideModal('mWin'); showMenu(); openLevels(); });

/* ---------- boot ---------- */
buildLogo();
refreshSound();
refreshMenu();
layout();
})();
</script>
